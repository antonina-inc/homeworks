<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../css/task1.css">
	<title>Document</title>
</head>

<body>
	<header>
		<div class="title">
			<h1>Задача №1</h1>
			<p>Розробити калькулятор</p>
		</div>
	</header>
	<main>
		<div class="container">
			<form action="#" class="calculator">
				<div class="calculator__numbers">
					<label for="num1">First number</label>
					<input type="number" id="num1">

					<label for="num2">Second number</label>
					<input type="number" id="num2">
				</div>
				<div class="calculator__actions">
					<button type="button" id="calcSum">Додати</button>
					<button type="button" id="calcSubtract">Відняти</button>
					<button type="button" id="calProduct">Помножити</button>
					<button type="button" id="calcDivision">Поділити</button>
				</div>
				<div class="calculator__result">
					<label for="res">Результат</label>
					<input type="number" id="res" value="">
				</div>
			</form>
		</div>
		<script src="../js/task1.js"></script>
		<br>
		<a href="../home_work_18.html">Home</a>

	</main>

	<footer></footer>
</body>


</html>
