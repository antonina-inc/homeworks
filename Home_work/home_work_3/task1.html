<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">

	<body>
		<h2>Задача №1</h2>
		<p>З клавіатури вводяться імена двох дітей та кількість у них цукерок. Вивести
			не екран ім’я тієї дитини, у якої кількість цукерок є більшою, або вивести,
			що кількість однакова.</p>
		<script>
			let nameFirstChild = prompt("Ім'я першої дитини - ", 'Олексій')
			let candyFirstChild = parseFloat(prompt('кількість цукерок', '5'))
			let nameSecondtChild = prompt("Ім'я другої дитини - ", 'Матвій')
			let candySecondtChild = parseFloat(prompt('кількість цукерок', '4'))
			if (candyFirstChild === candySecondtChild) document.write(`Діти мають однакову кількість цукерок`)
			else if (candyFirstChild > candySecondtChild) document.write(`${nameFirstChild} має більше цукерок`)
			else document.write(`${nameSecondtChild} має більше цукерок`)
	</script>

	</body>
</html>
