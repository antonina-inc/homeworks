		<h2>Задача №3</h2>
		<p>Випадковим чином генерується число від 1 до 5. Спробуйте вгадати число за 2
			спроби</p>
		<script>
			let randomNumber = 1 + Math.floor(Math.random() * 5)			 
			let firstAttempt = parseFloat(prompt('введіть число від 1 до 5'))
			if (firstAttempt === randomNumber) document.write (`Вітаємо, Ви відгадали число з першої спроби!`)
			 else {let secondAttempt = parseFloat(prompt('У Вас залишилась одна спроба - введіть число від 1 до 5'))
			   if (secondAttempt === randomNumber) document.write (`Вітаємо, Ви відгадали число з другої спроби!`)
			   else document.write (`Нажаль, Ви не вгадали(((((`)
			}
	</script>
