	<body>
		<h2>Задача №7</h2>
		<p>З клавіатури вводиться номер місяця. Вивести до якої пори він
			відноситься</p>
		<script>
			let enteredSeason = parseFloat(prompt('Введіть номер місяця'))		
			if (enteredSeason == 1 ||	enteredSeason ==2 || enteredSeason ==12) document.write (`Це зимовий місяць`)
			else if (enteredSeason >= 3 &&	enteredSeason <=5)  document.write (`Це весняний місяць`)	
			else if (enteredSeason >= 6 &&	enteredSeason <=8)  document.write (`Це літній місяць`)
			else if (enteredSeason >= 9 &&	enteredSeason <=11)  document.write (`Це осінній місяць`)
		else document.write (`Некоректно введені дані`)
	</script>
