<!DOCTYPE html>

<body>
	<h2>Задача №2</h2>

	<script>
		if (confirm('Почати тестування?')) {
			let sumFirst = parseInt(prompt('Введіть суму вкладу', 10000))
			for (let i = 0; i < 20; i++) {
				sumFirst += sumFirst / 100 * 20
			}
			let totalSum = sumFirst
			for (let j = 0; j < 17; j++) {
				totalSum += totalSum / 100 * 27
			}
			document.write(`Інвестор одержить ${totalSum.toFixed(2)} грн`)

		}
	</script>
