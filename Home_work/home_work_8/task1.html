	<script>
		if (confirm('Почати тестування?')) {
			function getAverageScore(evaluations) {
				let sumEvaluations = 0
				for (let i = 0; i < evaluations.length; i++) {
					sumEvaluations += evaluations[i]
				}
				return sumEvaluations / evaluations.length
			}
			function getProgressStudent(arr) {
				let min = arr[0]
				for (let i = 1; i < arr.length; i++) {
					if (arr[i] < min) min = arr[i]
				}
				if (min === 2) document.write('Двійочник')
				else if (min === 3) document.write('Трійочник')
				else if (min === 4 || 5) document.write('Хорошист')
			}
			let averageScore = [3, 4, 4, 5]
			const userAverageScore = getAverageScore(averageScore)

		}
