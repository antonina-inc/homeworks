	<script>
		if (confirm('Почати тестування?')) {
			let arr = [125, 80, 6, -563, 95, 123]
			let product = 1
			arr.forEach((number) => {
				if (number > 0) product *= number
			}
			)
			document.write(`В масиві ${arr} добуток усіх додатніх чисел - ${product}`);
		}	
	</script>
